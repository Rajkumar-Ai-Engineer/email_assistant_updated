[project]
name = "email-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.20",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.5.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
]

[project.scripts]
email-assistant = "email_assistant:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
